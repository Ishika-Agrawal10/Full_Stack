<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font style</title>
</head>
<style>
    p{
        font-family:Arial;
        font-size:50px;
        font-size-adjust:0.52;
        color: brown;
        font-weight:bold;
        font-stretch:medium;
        line-height: 2em;
        letter-spacing: 20px;
        word-spacing: 40px;
        text-align: center;
        text-decoration: underline;
        text-transform: uppercase;
        font-style: italic;
        text-shadow: 1px 10px 3px grey;

    }

</style>
<body>
    <p>This is the paragraph..</p>
</body>

</html>
