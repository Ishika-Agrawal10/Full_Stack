<!DOCTYPE html>
<html lang="en">
<head>

    }
    #pp{

        border: 3px solid black;
        flex-direction: column;
    }
   body{
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:20px;
        background-color:rgb(red, rgb(249, 127, 226), rgb(239, 170, 219));
   }
  
   
</style>
<body>
    
     
   <div class="main">
     <h1 >Gradient wheel</h1>
    <div class="container">
        <div id="pp">
            <h3 > 87%</h3>
            <p>power</p>
        </div>
    </div>
</div>
