<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">         
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        box-sizing:border-box;
    }
    body{
        margin:0;
        padding:0;
    }
    .navbar{
        margin:10px 0;
        height:80px;
        border:4px solid black;
        border-radius:8px;
        width:100%;
        display:flex;
        flex-direction:row;
        position:sticky;
        justify-content:space-between;
        background-color:beige;
        z-index:10;
        top:0;
    }
    .logo{
        font-size:40px;
        font-weight:bold;
    }
    .search{
        justify-content:space-between;
        margin:10px 5px;
        border:3px solid black;
        flex-direction:row;
        width:400px;
        border-radius:6px;
    }
    .search input{
        width:100%;
    }
    .container{
        min-height:100vh;
        width:100%;
        background-color:rgb(234, 228, 229);
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
        grid-auto-rows: 8px;
        gap:10px;
        margin:10px;
        padding:10px;
    }    
    .card{
        border-radius:13px;
        display:flex;
        flex-direction:column;
    }
    .footer{
        display:flex;
        margin: 10px;
        padding:10px;
        background-color:white;
        margin-top:auto;
       
    }
    .c1{
        background-color:rgb(231, 150, 164);
        grid-row:span 30;
    }
    .c2{
        background-color:yellow;
        grid-row:span 45;
    }
    .c3{
        background-color:rgb(228, 18, 53);
        grid-row:span 35;
    }
    .c4{
        background-color:rgb(217, 25, 217);
        grid-row:span  40;
    }
    .c5{
        background-color:orange;
        grid-row:span 45;
    }
    .c6{
        background-color:aqua;
        grid-row:span 25;
    }
    .c7{
        background-color:purple;
        grid-row:span 30;
    }
    .c8{
        background-color:blue;
        grid-row:span 45;
    }
    .c9{
        background-color:green;
        grid-row:span 45;
    }
    .c10{
        background-color:brown;
        grid-row:span 40;
    }
    
   @media (min-width:1200px){
    .container{
        grid-template-columns:repeat(5,1fr);
    }
   }
   @media (min-width:700px) and (max-width:1199px){
    .container{
        grid-template-columns:repeat(3,1fr);
    }
   }
   @media (max-width:700px){
    .container{
        grid-template-columns:repeat(2,1fr);
    }
    .search{
        display:none;
    }
   }
</style>
<body>
    <nav class="navbar">
        <div class="logo">Tile Press</div>
        <div class="search">
            <input type="text" placeholder="search in...">
        </div>
        <div class="icons">
            <button>🔔</button>
            <button>🥸</button>
        </div>
    </nav>
    <div class="container">
        <div class="card c1">
            <div class="footer">Autumn cabin mood board
                <p> @Alex</p>
            </div>
        </div>
        <div class="card c2">
            <div class="footer">
                Minimal desk setup @ hello
            </div>
        </div>
        <div class="card c3">
            <div class="footer">
                minimalistic bedroom design
            </div>
        </div>
        <div class="card c4">
            <div class="footer">
                kitchen aesthtic
            </div>
        </div>
        <div class="card c5">
            <div class="footer">bedroom</div>
        </div>
        <div class="card c6">
            <div class="footer">perfect for spring</div>
        </div>
        <div class="card c7">
            <div class="footer">king size bedroom</div>
        </div>
        <div class="card c8">
            <dic class="footer">bigggggg house💖</dic>
        </div>
        <div class="card c9">
            <div class="footer">helloo babbyy  </div>
        </div>
        <div class="card c10">
            <div class="footer">hellooo paris</div>
        </div>
    </div>
</body>
</html>
