<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard layout</title>
</head>
<style>
    
    
    #sidebar{
        position:fixed;
        top:5px;
        height:98%;
        width:250px;
        border:3px solid black;
    }
    h2{
        top:20px;
        background-color:rgb(236, 167, 178);

    }
    p{
        font-size:20px;
        font-weight:bold;
        text-decoration:underline;
        top:10px;
        height:20vh;
        width:100%;
        border:3px solid black;
        align-items:center;
        align-content:center;
        background-color:rgb(247, 51, 83);

    }
    #sidebar2{
        position:fixed;
        top:0;
        width:100%;
        height:100px;
        border:3px solid black;
    }
     .container2{
        /* flex-direction:row;
        outline: 3px solid black;
        justify-content:center;
        align-items: center;
        height: 90vh;
        align-content:center; */
          flex-direction: row;
        outline: 3px solid black;
        display: flex;
        justify-content:center;
        align-items: center;
        height: 98vh;
        background-color:cream;
    } 
    .container2>div{
        color:white;
        height:150px;
        width:150px; 
       
    }

    #box1{
        background-color: red;
        border:3px solid black;
        margin:20px;
    }
    #box2{
        background-color: blue;
        border:3px solid black;
         margin:20px;
    }
    #box3{
        background-color: green;
        border:3px solid black; 
         margin:20px;
    }
    #box4{
        background-color: yellow;
        border:3px solid black;  
        font-weight:bold;
        color:red;
          margin:20px;
    }
    h1{
        top:0;
        position:fixed;
        font-size:30px; 
        text-decoration:underline;
        box-shadow: 0 0 40px rgb(247, 51, 83);
    }
</style>
<body>
    <div class="container">        

        <div id="sidebar">
            <h2>Sidebar Content</h2>
            <p>Dashboard</p>
            <p>Products</p>
            <p>Orders</p>
            <p>Customers</p>

        </div>

    </div>
     <div id="sidebar2"></div>

     <div class="container2">
        <h1>Sales Dashboard Layout</h1>

        <div id="box1">Products</div>
         <div id="box2">Orders</div>
          <div id="box3">Customers</div>
           <div id="box4">Analytics</div>

     </div>
</body>
</html>
