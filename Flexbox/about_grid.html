<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid properties</title>
</head>
<style>
    :root{
        --primary-color:rgb(245, 184, 111);
        --secondary-color:rgb(105, 61, 69);
    }

    .container{
        display:grid;
        outline: 1px solid black;
        height:500px;
        width:500px;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        background-color: pink;
        
    }

    .parent{
        display:grid;
        font-size:30px;
        grid-template-columns: subgrid;
        grid-template-rows: subgrid;
        grid-column: 1/3;
        grid-row: 1/3;
        background-color: rgb(213, 242, 25);

    }
    .child{
         background-color:var(--secondary-color);
        background-color: rgb(107, 246, 146);
        grid-column: 1/2;
        grid-row: 1/2;
    }


</style>
<body>
    <div class="container">
        <div class="parent">
            <div class="child">
                1
            </div>
        </div>

    </div>
