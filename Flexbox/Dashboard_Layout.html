<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #333;
    }

    .dashboard {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: #1f2937;
      color: white;
      padding: 20px;
    }

    .sidebar h2 {
      margin-bottom: 30px;
      font-size: 24px;
    }

    .sidebar a {
      display: block;
      color: #d1d5db;
      text-decoration: none;
      margin: 12px 0;
      padding: 10px;
      border-radius: 8px;
    }

    .sidebar a:hover {
      background: #374151;
      color: white;
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      flex: 1;
      min-width: 180px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .card h3 {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 24px;
      font-weight: bold;
    }

    .content {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .panel {
      flex: 1;
      min-width: 280px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .panel ul {
      list-style: none;
      margin-top: 10px;
    }

    .panel li {
      padding: 8px 0;
      border-bottom: 1px solid #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <h2>DashBoard</h2>
      <a href="#">Home</a>
      <a href="#">Analytics</a>
      <a href="#">Orders</a>
      <a href="#">Users</a>
      <a href="#">Settings</a>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1>Welcome back!</h1>
        <button>+ New Report</button>
      </div>

      <section class="cards">
        <div class="card">
          <h3>Total Sales</h3>
          <p>$12,480</p>
        </div>
        <div class="card">
          <h3>Visitors</h3>
          <p>8,420</p>
        </div>
        <div class="card">
          <h3>Orders</h3>
          <p>324</p>
        </div>
        <div class="card">
          <h3>Pending</h3>
          <p>18</p>
        </div>
      </section>

      <section class="content">
        <div class="panel">
          <h3>Recent Activity</h3>
          <ul>
            <li>New user registered</li>
            <li>Payment completed</li>
            <li>Order shipped</li>
          </ul>
        </div>

        <div class="panel">
          <h3>Tasks</h3>
          <ul>
            <li>Review weekly report</li>
            <li>Update product prices</li>
            <li>Send client email</li>
          </ul>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
