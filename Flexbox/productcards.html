<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product card</title>
</head>
<style>

    #main{
        display: flex;
        justify-content: space-around;
        align-items: center;
        height: 100vh;
    }

    .product-card{
        width: 300px;
        border: 1px solid #ccc;
        border-radius: 5px;
        padding: 20px;
        text-align: center;
    }

    .product-card img{
        width: 100%;
        height: auto;
        margin-bottom: 10px;
    }

    .product-card h3{
        margin-bottom: 10px;
    }

    .product-card p{
        margin-bottom: 10px;
    }

    .product-card .price{
        font-weight: bold;
        color: #f00;
    }
</style>
<body>
    <div id="main">
        <div class="product-card">
            <img src="product-image.jpg" alt="Product Image">
            <h3>Product Name - Flower</h3>
            <p>Product description goes here.</p>
            <p class="price">$99.99</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="product-image.jpg" alt="Product Image">
            <h3>Product Name-2 Ribbon</h3>
            <p>Product description goes here.</p>
            <p class="price">$99.99</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="product-image.jpg" alt="Product Image">
            <h3>Product Name-3 Brass</h3>
            <p>Product description goes here.</p>
            <p class="price">$99.99</p>
            <button>Add to Cart</button>
        </div>
        
    </div>
    
</body>
</html>
