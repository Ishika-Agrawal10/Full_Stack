<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
</head>
<style>
    body{
        height:100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin:0px;
        padding:0px;
        background-color: rgb(226, 241, 134);

    }
   
    .conatiner{
        background-color: white;
        border: 4px solid black;
        height:97vh;
        width:97vw;
        display:flex;
        justify-content: center;
        align-items: center;
    }
    #login{
        background-color: rgb(191, 127, 127);
        max-width: 300px;
        min-width: 300px;
        height: 300px;
        margin:auto;
    }
    #login>h1{
        text-align: center;
        text-decoration: underline;
    }
    #login input{
        display: block;
        margin: auto;
        margin-top: 5px;
        border-radius: 0px;
        box-shadow: 3px 3px 0 black;
        font-size: 20px;
    }
    input[type="submit"]{
        margin-top: 7%;
        background-color:black;
        color:white;
    }
    button{
          display: block;
        margin: auto;
        margin-top: 5px;
        border-radius: 0px;
        box-shadow: 3px 3px 0 black;
    }
</style>
<body>
    
    <div class="container">
     
    <div id="login">
           <h1> Login page</h1>
        <input type="name" placeholder="Enter First Name"/>
        <br>
        <Input type="password" Placeholder="Enter Password"/>
        <br>
        <input type="email" placeholder="Enter Email"/>
        <br>
        <input type="number"  />
        <br>
        <button >Submit</button>
    </div>
    </div>
</body>
</html>
