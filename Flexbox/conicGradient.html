<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollow Gradient Squares</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

        }



        #box2 {
            position: absolute;
            width: 300px;
            height: 300px;

            top: 300px;
            left: 100px;
            border: 5px solid transparent;
            border-image: conic-gradient(
                red,
                yellow,
                green,
                blue,
                red
            ) 1;
            background:conic-gradient(red, yellow, green, blue);
            background-clip:text;
            color:transparent;
            text-align:center;
            font-weight:bold;
            font-size:30px;
        }
        #box3{
            top:100px;
            width:250px;
            height: 250px;
            background:conic-gradient(red, yellow, green, blue, red);
            border-radius: 50%;
        }
        #box4{
            height:300px;
            width:300px;
            background:linear-gradient(rgb(99, 7, 7));
            background-clip:text;
            color:transparent;
            text-align: center;
            font-weight: bold;
            font-size: 30px;
        }
    </style>
</head>

<body>
    <div id="box2">
        <h1>ISHIKA</h1>
    </div>
    <div id="box3"></div>
    <div id="box4">
            <h1>hello</h1>
    </div>
</body>
</html>
