<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        box-sizing:border-box;
    }
    body{
        margin:0;
        padding:0;
        background-color:beige;
    }
    .navbar{
        width:100%;
        border-radius:8px;
        height:70px;
        display:flex;
        flex-direction:row;
        border:4px solid black;
        justify-content:space-between;
        padding:10px;
        margin:10px;
        position:sticky;
        z-index: 10;
        top:0;
        background-color:white;
    }
    .search{
        width:300px;
        height:40px;
        border:3px solid black;
        border-radius:8px;
    }
    .search input{
        width:100%;
        height:100%;
        font-size:18px;

    }
    .logo{
        font-size:30px;
        font-weight:bold;
    }
    .gallery{
        padding:10px;
        margin:10px;
        grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
        grid-auto-rows:8px;
        gap:15px;
        border-radius:12px;
        display:grid;
    }
    .card{
        display:flex;
        flex-direction:column;
        border-radius:12px;
    }
    .footer{
        margin:10px;
        padding:10px;
        background-color:white;
        display:flex;
        margin-top:auto;
        
    }
    .c1{
        background-color:pink;
        grid-row:span 40;
    }
    .c2{
        background-color:red;
        grid-row:span 35;
    }
    .c3{
        background-color:brown;
        grid-row:span 45;
    }
    .c4{
        background-color:violet;
        grid-row:span 45;
    }
    .c5{
        background-color:rgb(240, 240, 8);
        grid-row:span 35;
    }
    .c6{
        background-color:blue;
        grid-row:span 35;
    }
    .c7{
        background-color:aqua;
        grid-row:span 45;
    }
    .c8{
        background-color:cyan;
        grid-row:span 35;
    }
    .c9{
        background-color:violet;
        grid-row:span 45;
    }
    .c10{
        background-color:pink;
        grid-row:span 40;
    }

</style>
<body>
    <nav class="navbar">
        <div class="logo">
            tile press
        </div>
        <div class="search">
            <input type="text" placeholder="search in...">
        </div>
        <div class="icon">
        <button>🔔</button>
        <button>heii</button>
        </div>
    </nav>
    <div class="gallery">
    <div class="card c1">
        <div class="footer">
            Autumn cabin needs board
        </div>
    </div>
    <div class="card c2">
        <div class="footer">
            minimal desk design
        </div>
    </div>
    <div class="card c3">
        <div class="footer">
            wallpaper
        </div>
    </div>
    <div class="card c4">
        <div class="footer">
            the house kitchens
        </div>
    </div>
    <div class="card c5">
        <div class="footer">
            king room
        </div>
    </div>
    <div class="card c6">
        <div class="footer">the bedroomm</div>
    </div>
    <div class="card c7">
        <div class="footer">sunset gradient radient</div>
    </div>
    <div class="card c8">
        <div class="footer">the beach</div>
    </div>
    <div class="card c9">
        <div class="footer">the sunshine</div>
    </div>
    <div class="card c10">
        <div class="footer">the kitvhen king shine</div>
    </div>
    </div>
</body>
</html>
