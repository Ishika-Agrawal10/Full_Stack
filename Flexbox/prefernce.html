<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #mypara{
        color:green;
    }
    .para{
        color:blue;
    }
    p{
        color: red !important;
      
    }
    h1{
        color:rgb(14, 41, 165);
          text-decoration:underline;
    }
    button:hover{
        background-color: black;
        color:aliceblue;
    }
    button:active{
         background-color:red;
        color:aliceblue;
    }
    button:focus{
       background-color: green;
       color:orange;
    }
    a:link{
        text-decoration: none;
        color:black;

    }
    a:visited{
        color:green;
    }
    input:checked{
        accent-color:brown;
        box-shadow: 1px 1px 5px black;
    }
    li:nth-child(3n){
        background-color: yellow;
    }
      li:nth-child(2n){
        background-color: pink;
    }
      li:nth-child(-n+2){
        background-color: rgb(90, 15, 27);
    }
</style>
<body>
    <h1>Ishikaa Agrawal</h1>
    <p class="para" id="mypara">Hello world....!!</p>
    <button> Click me!</button>
    <br>
    <br>
    <a href="#">Link</a>
    <input type="checkbox" checked/>
    <input type="checkbox" />

   <ul>
    <li>1</li>
    <li>2</li>
    <li>3</li>
    <li>4</li>
    <li>5</li>
    <li>6</li>
    <li>7</li>
   </ul>

</body>
</html>
